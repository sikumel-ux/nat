<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Paket | Mahika Trans</title>
    <link rel="stylesheet" href="nav.css">
    <meta name="theme-color" content="#065084">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #065084; 
            --bg-darker: #043a60; 
            --gold: #FFD700; 
            --white-gading: #fffdf5;
        }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding-bottom: 120px; color: #333; }
        
        /* Header Section */
        .header-curvy { background: linear-gradient(135deg, var(--bg-darker), var(--primary-blue)); padding: 50px 25px 80px 25px; border-radius: 0 0 50px 50px; text-align: center; }
        .header-curvy h2 { color: var(--gold); font-weight: 700; font-size: 24px; margin: 0; text-transform: uppercase; }
        .header-curvy p { color: var(--white-gading) !important; font-size: 13px; margin: 0; font-weight: 400; opacity: 0.9; letter-spacing: 0.5px; }

        /* Form Layout */
        .form-container { margin-top: -50px; padding: 0 20px; position: relative; z-index: 10; }
        .card-input { background: white; border-radius: 30px; padding: 30px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid var(--gold); }
        
        .section-title { font-size: 12px; font-weight: 700; color: var(--primary-blue); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .section-title hr { flex: 1; border: 0; border-top: 1px solid #eee; }

        .group-field { margin-bottom: 18px; }
        .group-field label { display: block; font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 6px; }
        .group-field input { width: 100%; border: 1.5px solid #eee; padding: 14px; border-radius: 15px; font-family: 'Poppins'; font-size: 13px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .group-field input:focus { border-color: var(--primary-blue); }
        
        .row-flex { display: flex; gap: 15px; }
        .half { flex: 1; }
        
        .btn-save { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-save:active { transform: scale(0.98); }

        /* Modal Sukses */
        .modal { display: none; position: fixed; inset: 0; background: rgba(4, 58, 96, 0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 100%; max-width: 300px; border-radius: 40px; padding: 40px 25px; text-align: center; border-bottom: 8px solid var(--gold); }
        .icon-check { color: var(--gold); font-size: 70px; margin-bottom: 15px; }
        .btn-modal { display: block; width: 100%; padding: 16px; border-radius: 15px; font-size: 13px; font-weight: 700; text-decoration: none; margin-bottom: 12px; text-transform: uppercase; box-sizing: border-box; }
        .btn-wa { background: var(--primary-blue); color: white; }
        .btn-manifes { background: #f0f4f8; color: #666; }
    </style>
</head>
<body>

<div class="header-curvy">
    <h2>MAHIKA TRANS</h2>
    <p>Pengiriman Paket & Barang</p>
</div>

<div class="form-container">
    <div class="card-input">
        <div class="section-title"><i class="fas fa-paper-plane"></i> PENGIRIM <hr></div>
        <div class="group-field"><label>Nama Pengirim</label><input type="text" id="pengirim" placeholder="Nama lengkap"></div>
        <div class="group-field"><label>No. WhatsApp Pengirim</label><input type="tel" id="wa_pengirim" placeholder="0812..."></div>

        <div class="section-title"><i class="fas fa-map-marker-alt"></i> PENERIMA <hr></div>
        <div class="group-field"><label>Nama Penerima</label><input type="text" id="penerima" placeholder="Nama lengkap"></div>
        <div class="group-field"><label>No. WhatsApp Penerima</label><input type="tel" id="wa_penerima" placeholder="08xx..."></div>
        <div class="group-field"><label>Alamat / Kota Tujuan</label><input type="text" id="tujuan" placeholder="Contoh: Lampung Selatan"></div>

        <div class="section-title"><i class="fas fa-box"></i> DETAIL BARANG <hr></div>
        <div class="row-flex">
            <div class="group-field half"><label>Jenis Barang</label><input type="text" id="barang" placeholder="Kardus/Dokumen"></div>
            <div class="group-field half"><label>Berat/Koli</label><input type="text" id="berat" placeholder="10 Kg"></div>
        </div>
        <div class="group-field"><label>Armada</label><input type="text" id="armada" placeholder="Mahika Jaya"></div>
        
        <div class="row-flex">
            <div class="group-field half"><label>Ongkir</label><input type="number" id="harga" placeholder="150000"></div>
            <div class="group-field half"><label>Komisi</label><input type="number" id="komisi" placeholder="15000"></div>
        </div>

        <div class="row-flex">
            <div class="group-field half"><label>Tanggal</label><input type="date" id="tgl_only"></div>
            <div class="group-field half"><label>Jam</label><input type="text" id="jam_only" placeholder="19:00"></div>
        </div>

        <button id="btnSimpan" class="btn-save">SIMPAN & KIRIM KUITANSI</button>
    </div>
</div>

<div class="nav-bottom">
    <a href="pwa-home.html"><i class="fas fa-house"></i>Home</a>
    <a href="input-paket.html" class="active"><i class="fas fa-box"></i>Paket</a>
    <a href="manifes-paket.html"><i class="fas fa-list"></i>Manifes</a>
    <a href="pwa-kmsi.html"><i class="fas fa-wallet"></i>Komisi</a>
</div>

<div id="modalSukses" class="modal">
    <div class="modal-content">
        <i class="fas fa-check-circle icon-check"></i>
        <h3 style="font-weight:700; margin:0; color: var(--primary-blue);">INPUT BERHASIL!</h3>
        <p style="font-size:12px; color:#777; margin-bottom:25px;">Data paket & kuitansi telah tersimpan.</p>
        <a id="linkWA" href="#" target="_blank" class="btn-modal btn-wa"><i class="fab fa-whatsapp"></i> KIRIM KUITANSI</a>
        <a href="manifes-paket.html" class="btn-modal btn-manifes">BUKA MANIFES</a>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--primary-blue); font-size:11px; font-weight:600; cursor:pointer; margin-top:10px;">INPUT BARU</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAmTAWHcHpolaIHegLceyMqExVgzufJzaU", 
        authDomain: "mahika-trans.firebaseapp.com", 
        projectId: "mahika-trans", 
        storageBucket: "mahika-trans.firebasestorage.app", 
        appId: "1:1087881066133:web:148d51c88f1de3466ecd9c" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('tgl_only').valueAsDate = new Date();

    document.getElementById('btnSimpan').onclick = async function() {
        const btn = this;
        const data = {
            pengirim: document.getElementById('pengirim').value,
            wa_pengirim: document.getElementById('wa_pengirim').value,
            penerima: document.getElementById('penerima').value,
            wa_penerima: document.getElementById('wa_penerima').value,
            tujuan: document.getElementById('tujuan').value,
            barang: document.getElementById('barang').value,
            berat: document.getElementById('berat').value,
            armada: document.getElementById('armada').value,
            harga: document.getElementById('harga').value,
            komisi: document.getElementById('komisi').value,
            tgl: document.getElementById('tgl_only').value,
            jam: document.getElementById('jam_only').value
        };

        if(!data.pengirim || !data.wa_pengirim || !data.penerima) return alert("Data Pengirim & Penerima wajib lengkap!");

        btn.innerText = "MENYIMPAN...";
        btn.disabled = true;

        const randomID = "PKG" + Math.floor(100000 + Math.random() * 900000).toString();

        try {
            await setDoc(doc(db, "packages", randomID), {
                ...data,
                status: "Diproses",
                createdAt: serverTimestamp()
            });

            // Link Kuitansi Digital (menggunakan domain yang sama dengan tiket)
            const linkKuitansi = `https://go.mahikatrans.my.id/${randomID}`;

            const textWA = `*KUITANSI PENGIRIMAN - MAHIKA TRANS*%0A` +
                           `----------------------------------------%0A` +
                           `No. Resi: *${randomID}*%0A` +
                           `Status: *SIAP BERANGKAT*%0A%0A` +
                           `*PENGIRIM:* ${data.pengirim}%0A` +
                           `*PENERIMA:* ${data.penerima}%0A` +
                           `*TUJUAN:* ${data.tujuan}%0A%0A` +
                           `*DETAIL:*%0A` +
                           `${data.barang} (${data.berat})%0A` +
                           `Ongkir: Rp ${Number(data.harga).toLocaleString('id-ID')}%0A` +
                           `----------------------------------------%0A` +
                           `Lihat Kuitansi Digital:%0A` +
                           `${linkKuitansi}%0A` +
                           `----------------------------------------%0A` +
                           `Terimakasih telah mempercayakan kiriman Anda pada Mahika Trans.`;

            let formattedWA = data.wa_pengirim.startsWith('0') ? '62' + data.wa_pengirim.substring(1) : data.wa_pengirim;
            document.getElementById('linkWA').href = `https://wa.me/${formattedWA}?text=${textWA}`;
            document.getElementById('modalSukses').style.display = 'flex';

        } catch (e) { 
            alert("Gagal simpan: " + e.message); 
        } finally { 
            btn.innerText = "SIMPAN & KIRIM KUITANSI"; 
            btn.disabled = false; 
        }
    }
</script>

</body>
</html>
