<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAHIKA | Future of Travel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mahika.css">
</head>
<body class="bg-black text-white">

    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-yellow-400/10 blur-[120px] pointer-events-none"></div>

    <div class="max-w-lg mx-auto min-h-screen flex flex-col px-6 pt-10 pb-32 relative z-10">
        
        <header class="flex justify-between items-center bg-white/5 backdrop-blur-xl border border-white/10 p-4 rounded-[30px] mb-12 shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-400 rounded-2xl rotate-12 flex items-center justify-center shadow-[0_0_20px_rgba(250,204,21,0.4)]">
                    <i class="fa-solid fa-bolt-lightning text-[#053a6f] text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tighter leading-none">MAHIKA</h1>
                    <span class="text-[8px] font-bold text-yellow-400 tracking-[.4em] uppercase">Premium Trans</span>
                </div>
            </div>
            <button onclick="toggleProfile()" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center active:scale-90 transition-all">
                <i class="fa-solid fa-bars-staggered text-sm"></i>
            </button>
        </header>

        <section class="mb-10 px-2">
            <h2 class="text-4xl font-light leading-tight">Mau jalan-jalan<br><span class="font-bold text-yellow-400">ke mana hari ini?</span></h2>
        </section>

        <div class="search-island relative mb-8">
            <div class="bg-[#111] border border-white/5 p-4 rounded-[40px] shadow-[0_30px_60px_rgba(0,0,0,0.5)]">
                <div class="flex items-center gap-4 bg-white/5 p-4 rounded-[30px] mb-3 focus-within:bg-white/10 transition-all">
                    <i class="fa-solid fa-location-dot text-yellow-400"></i>
                    <input type="text" id="search-input" placeholder="Tujuan kamu..." class="bg-transparent w-full outline-none text-sm font-medium">
                </div>
                <button id="btnSearch" class="w-full bg-yellow-400 text-black h-16 rounded-[30px] font-black text-xs uppercase tracking-widest shadow-lg shadow-yellow-400/20 active:scale-95 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-paper-plane"></i> TEMUKAN TIKET
                </button>
            </div>
        </div>

        <div class="flex gap-3 overflow-x-auto pb-8 scrollbar-hide">
            <div onclick="quickSearch('Jakarta')" class="dest-card">
                <span class="text-[20px] mb-2">🏙️</span>
                <span class="text-[9px] font-bold uppercase tracking-widest">Jakarta</span>
            </div>
            <div onclick="quickSearch('Surabaya')" class="dest-card">
                <span class="text-[20px] mb-2">🌋</span>
                <span class="text-[9px] font-bold uppercase tracking-widest">Surabaya</span>
            </div>
            <div onclick="quickSearch('Jogja')" class="dest-card">
                <span class="text-[20px] mb-2">🏯</span>
                <span class="text-[9px] font-bold uppercase tracking-widest">Jogja</span>
            </div>
            <div onclick="quickSearch('Bali')" class="dest-card">
                <span class="text-[20px] mb-2">🏖️</span>
                <span class="text-[9px] font-bold uppercase tracking-widest">Bali</span>
            </div>
        </div>

        <div class="bg-white/5 border border-white/5 py-3 rounded-2xl mb-12 overflow-hidden">
            <div class="marquee-content flex items-center gap-12 text-[9px] font-bold uppercase text-white/20">
                <span>Murni Jaya</span> <span>Agra Mas</span> <span>Putra Remaja</span> <span>Handoyo</span> <span>ALS</span> <span>Gunung Harta</span>
                <span>Murni Jaya</span> <span>Agra Mas</span> <span>Putra Remaja</span> <span>Handoyo</span> <span>ALS</span> <span>Gunung Harta</span>
            </div>
        </div>

        <div id="result-container" class="hidden animate-in">
            <div id="bus-list" class="space-y-6 relative before:absolute before:left-6 before:top-0 before:bottom-0 before:w-px before:bg-white/10">
                </div>
        </div>

    </div>

    <div id="company-profile" class="fixed inset-0 z-[2000] invisible">
        <div id="profile-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-md opacity-0 transition-all duration-500" onclick="toggleProfile()"></div>
        <div id="profile-content" class="absolute right-0 top-0 bottom-0 w-[80%] bg-[#0a0a0a] translate-x-full transition-all duration-500 p-10 flex flex-col justify-between">
            <div>
                <button onclick="toggleProfile()" class="mb-10 text-white/40"><i class="fa-solid fa-arrow-left text-xl"></i></button>
                <div class="space-y-8">
                    <a href="#" class="block text-3xl font-bold hover:text-yellow-400 transition-colors">Our Story</a>
                    <a href="#" class="block text-3xl font-bold hover:text-yellow-400 transition-colors">Fleet Gallery</a>
                    <a href="#" class="block text-3xl font-bold hover:text-yellow-400 transition-colors">Support</a>
                </div>
            </div>
            <div class="p-6 bg-yellow-400 rounded-[30px]">
                <p class="text-black font-black text-xs uppercase mb-1">Hubungi Kami</p>
                <p class="text-black/60 text-[10px] font-bold mb-4">CS Mahika Trans Yogyakarta</p>
                <a href="https://wa.me/6281211407667" class="inline-block bg-black text-white px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest">Chat WA</a>
            </div>
        </div>
    </div>

    <script type="module" src="mahika.js"></script>
</body>
</html>
