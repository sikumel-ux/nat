<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Edit Pro | Google OCR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <nav class="bg-white shadow-sm py-4 px-8 border-b">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-xl text-slate-800">
                <i class="fas fa-file-signature text-blue-600"></i>
                <span>PDF<span class="text-blue-600">Editor</span></span>
            </div>
            <span class="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-500">v2.0 - Auto Clean Drive</span>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto mt-12 px-6">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Ubah PDF jadi Teks</h2>
            <p class="text-slate-500 mb-8 text-sm">File akan diubah ke format Google Docs agar tulisan bisa dihapus & diedit. File akan otomatis dihapus dari Drive dalam 1 jam.</p>

            <div id="drop-area" class="border-2 border-dashed border-blue-200 rounded-2xl p-12 text-center hover:bg-blue-50 transition cursor-pointer group">
                <input type="file" id="pdfFile" class="hidden" accept="application/pdf">
                <i class="fas fa-cloud-upload-alt text-4xl text-blue-400 group-hover:text-blue-600 transition mb-4"></i>
                <p class="text-slate-600 font-medium" id="file-label">Klik atau tarik file PDF ke sini</p>
            </div>

            <div id="status-box" class="hidden mt-6 p-4 rounded-xl text-center">
                <div id="loader" class="inline-block w-6 h-6 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin mb-2"></div>
                <p id="status-text" class="text-sm font-medium text-slate-700"></p>
            </div>

            <button onclick="prosesFile()" id="btn-start" class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
                Mulai Proses Sekarang
            </button>
        </div>
    </main>

    <script>
        // API KAMU YANG BARU
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxE5OyY7265p3x6HNeeZchdkQ4yOj5qnK1-rO1yxRxabrHh0P9r0lRv39ixwkJBsYU8/exec";

        const fileInput = document.getElementById('pdfFile');
        const dropArea = document.getElementById('drop-area');
        const fileLabel = document.getElementById('file-label');
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const btnStart = document.getElementById('btn-start');

        dropArea.onclick = () => fileInput.click();

        fileInput.onchange = () => {
            if(fileInput.files.length > 0) fileLabel.innerText = "File terpilih: " + fileInput.files[0].name;
        };

        async function prosesFile() {
            if (fileInput.files.length === 0) return alert("Pilih file dulu!");

            // UI Loading
            btnStart.disabled = true;
            btnStart.classList.add('opacity-50');
            statusBox.classList.remove('hidden');
            statusText.innerText = "Mengunggah & menjalankan OCR (Tunggu ±10 detik)...";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const base64Data = reader.result.split(',')[1];

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ base64: base64Data, fileName: file.name })
                    });

                    const res = await response.json();

                    if (res.status === "success") {
                        document.getElementById('loader').classList.add('hidden');
                        statusText.innerHTML = `
                            <div class="bg-green-50 text-green-700 p-4 rounded-lg border border-green-200">
                                <p class="mb-3 font-bold">✨ Konversi Berhasil!</p>
                                <a href="${res.docUrl}" target="_blank" class="bg-green-600 text-white px-6 py-2 rounded-lg inline-block hover:bg-green-700">KLIK UNTUK EDIT TULISAN</a>
                            </div>`;
                    } else {
                        throw new Error(res.message);
                    }
                } catch (err) {
                    statusText.innerText = "Gagal: " + err.message;
                    btnStart.disabled = false;
                    btnStart.classList.remove('opacity-50');
                }
            };
        }
    </script>
</body>
</html>
