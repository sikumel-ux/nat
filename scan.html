<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika KTP Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --deep-blue: #053a6f; --mahika-yellow: #facc15; --white-off: #fdfaf0; --light-bg: #f3f4f6; }
        * { box-sizing: border-box; }
        body { margin: 0; background-color: var(--light-bg); font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .top-section {
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%);
            height: 220px; display: flex; flex-direction: column; align-items: center; padding-top: 45px;
        }
        .title-brand { font-size: 38px; font-weight: 800; letter-spacing: -2px; margin: 0; display: flex; gap: 8px; }
        .brand-mahika { color: var(--mahika-yellow); }
        .brand-trans { color: var(--white-off); font-weight: 200; }
        .brand-sub { display: block; color: var(--mahika-yellow); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

        .main-container { max-width: 400px; margin: -95px auto 40px auto; padding: 0 20px; position: relative; z-index: 10; }
        .scan-card { background: white; border-radius: 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); padding: 24px; }

        .camera-box { width: 100%; border-radius: 20px; overflow: hidden; position: relative; background: #000; aspect-ratio: 3/2; border: 2px solid #eee; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; top: 15%; left: 10%; right: 10%; bottom: 15%; border: 2px solid var(--mahika-yellow); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); pointer-events: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action {
            flex: 1; background: var(--mahika-yellow); padding: 15px; border-radius: 14px; border: none;
            color: var(--deep-blue); font-weight: 800; font-size: 14px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(250, 204, 21, 0.2);
        }
        .btn-secondary { background: #e2e8f0; box-shadow: none; }
        .btn-action:active { transform: scale(0.95); }

        .form-group { margin-top: 15px; }
        .form-group label { display: block; font-size: 9px; font-weight: 800; color: var(--deep-blue); margin-bottom: 4px; text-transform: uppercase; opacity: 0.6; }
        .form-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #f1f5f9; background: #fafafa; font-family: inherit; font-weight: 600; color: var(--deep-blue); }
        
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="brand-container">
            <h1 class="title-brand">
                <span class="brand-mahika">MAHIKA</span>
                <span class="brand-trans">Scanner</span>
            </h1>
            <span class="brand-sub">Reservation Intelligence System</span>
        </div>
    </div>

    <div class="main-container">
        <div class="scan-card">
            <div class="camera-box"><video id="video" autoplay playsinline></video><div class="overlay"></div></div>

            <div class="btn-group">
                <button class="btn-action" id="btnCap" onclick="takeSnapshot()"><i class="fa-solid fa-camera"></i> SCAN</button>
                <button class="btn-action btn-secondary" onclick="document.getElementById('fileIn').click()"><i class="fa-solid fa-image"></i> GALLERY</button>
            </div>
            
            <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="fromGallery(this)">

            <div style="margin-top: 20px;">
                <div class="form-group"><label>NIK</label><input type="text" id="nik"></div>
                <div class="form-group"><label>Nama</label><input type="text" id="nama"></div>
                <div style="display:flex; gap:10px">
                    <div class="form-group" style="flex:2"><label>Tgl Lahir</label><input type="text" id="tgl"></div>
                    <div class="form-group" style="flex:1"><label>Umur</label><input type="text" id="umur" readonly></div>
                </div>
                <div class="form-group"><label>Kabupaten/Kota</label><input type="text" id="kota"></div>
            </div>

            <button class="btn-action" style="background:var(--deep-blue); color:white; margin-top:20px; width:100%" onclick="alert('Data Tersimpan!')">CONFIRM DATA</button>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCap = document.getElementById('btnCap');

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

        function takeSnapshot() {
            processStart();
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            sendToBackend(canvas.toDataURL('image/jpeg'));
        }

        function fromGallery(input) {
            if (input.files && input.files[0]) {
                processStart();
                const reader = new FileReader();
                reader.onload = e => sendToBackend(e.target.result);
                reader.readAsDataURL(input.files[0]);
            }
        }

        function processStart() {
            btnCap.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> WAIT..';
            document.querySelector('.scan-card').classList.add('loading');
        }

        function sendToBackend(base64) {
            google.script.run.withSuccessHandler(res => {
                btnCap.innerHTML = '<i class="fa-solid fa-camera"></i> SCAN';
                document.querySelector('.scan-card').classList.remove('loading');
                if(res.error) return alert(res.error);
                
                document.getElementById('nik').value = res.nik || "";
                document.getElementById('nama').value = res.nama || "";
                document.getElementById('tgl').value = res.tgl_lahir || "";
                document.getElementById('umur').value = res.umur || "";
                document.getElementById('kota').value = res.kota || "";
            }).processKTP(base64);
        }
    </script>
</body>
</html>
