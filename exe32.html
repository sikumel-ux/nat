<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Seat Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --deep-blue: #053a6f; 
            --mahika-yellow: #facc15; 
            --white-off: #fdfaf0; /* Putih gading */
            --light-bg: #f3f4f6;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background-color: var(--light-bg); 
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Bagian Atas Biru */
        .top-section {
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%);
            height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* Style Header Teks */
        .brand-container { text-align: center; }
        .brand-main { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
        .brand-mahika { color: var(--mahika-yellow); }
        .brand-trans { color: var(--white-off); }
        .brand-sub { 
            display: block; 
            color: var(--mahika-yellow); 
            font-size: 11px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .main-container {
            max-width: 400px;
            margin: -120px auto 40px auto; 
            padding: 0 20px;
        }

        .seat-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            padding: 24px;
            position: relative;
        }

        .bus-frame {
            border: 2px solid #f1f5f9;
            border-radius: 20px;
            padding: 15px;
            background: #fafafa;
        }

        .driver-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .steer {
            width: 32px; height: 32px;
            border: 4px solid var(--deep-blue);
            border-radius: 50%;
            position: relative;
            opacity: 0.7;
        }
        .steer::after {
            content: ""; position: absolute; width: 14px; height: 4px; 
            background: var(--deep-blue); top: 10px; left: 5px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 30px 1fr 1fr;
            gap: 12px 8px;
        }

        .seat {
            aspect-ratio: 1/1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #e5e7eb;
            background: white;
            color: var(--deep-blue);
            cursor: pointer;
        }

        .aisle { grid-column: 3; }

        /* Row Belakang Khusus */
        .back-section {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr 30px 1fr 1fr;
            gap: 12px 8px;
        }

        .box-large {
            background: #e5e7eb;
            border: 2px solid #d1d5db;
            color: #64748b;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            min-height: 45px;
            text-transform: uppercase;
        }

        .pintu { grid-column: 1 / span 2; background: #fef3c7; border-color: #fcd34d; color: #92400e; }
        .toilet { grid-column: 1 / span 3; }

        .btn-action {
            background: var(--mahika-yellow);
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(250, 204, 21, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="brand-container">
            <div class="brand-main">
                <span class="brand-mahika">MAHIKA</span><span class="brand-trans"> Trans</span>
            </div>
            <span class="brand-sub">Official Reservation Partner</span>
        </div>
    </div>

    <div class="main-container">
        <div class="seat-card">
            <div class="bus-frame">
                <div class="driver-row">
                    <div class="steer"></div>
                </div>

                <div class="grid-layout">
                    <div class="seat">1</div><div class="seat">2</div><div class="aisle"></div><div class="seat">3</div><div class="seat">4</div>
                    <div class="seat">5</div><div class="seat">6</div><div class="aisle"></div><div class="seat">7</div><div class="seat">8</div>
                    <div class="seat">9</div><div class="seat">10</div><div class="aisle"></div><div class="seat">11</div><div class="seat">12</div>
                    <div class="seat">13</div><div class="seat">14</div><div class="aisle"></div><div class="seat">15</div><div class="seat">16</div>
                    <div class="seat">17</div><div class="seat">18</div><div class="aisle"></div><div class="seat">19</div><div class="seat">20</div>
                    <div class="seat">21</div><div class="seat">22</div><div class="aisle"></div><div class="seat">23</div><div class="seat">24</div>
                    <div class="seat">25</div><div class="seat">26</div><div class="aisle"></div><div class="seat">27</div><div class="seat">28</div>
                </div>

                <div class="back-section">
                    <div class="box-large pintu">PINTU</div>
                    <div class="aisle"></div>
                    <div class="seat">29</div><div class="seat">30</div>
                </div>

                <div class="back-section">
                    <div class="box-large toilet">TOILET</div>
                    <div class="seat">31</div><div class="seat">32</div>
                </div>
            </div>
        </div>
        <button class="btn-action"></button>
    </div>

</body>
</html>
