<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Paket | Mahika Trans</title>
    <link rel="stylesheet" href="nav.css">
    <meta name="theme-color" content="#065084">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-blue: #065084; --bg-darker: #043a60; --gold: #FFD700; --white-gading: #fffdf5; }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding-bottom: 120px; color: #333; }
        .header-curvy { background: linear-gradient(135deg, var(--bg-darker), var(--primary-blue)); padding: 50px 25px 80px 25px; border-radius: 0 0 50px 50px; text-align: center; }
        .header-curvy h2 { color: var(--gold); font-weight: 700; font-size: 24px; margin: 0; text-transform: uppercase; }
        .header-curvy p { color: var(--white-gading) !important; font-size: 13px; margin: 0; opacity: 0.9; }
        .form-container { margin-top: -50px; padding: 0 20px; position: relative; z-index: 10; }
        .card-input { background: white; border-radius: 30px; padding: 30px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid var(--gold); }
        .group-field { margin-bottom: 18px; }
        .group-field label { display: block; font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 6px; }
        .group-field input { width: 100%; border: 1.5px solid #eee; padding: 14px; border-radius: 15px; font-family: 'Poppins'; font-size: 13px; box-sizing: border-box; outline: none; }
        .row-flex { display: flex; gap: 15px; }
        .half { flex: 1; }
        .btn-save { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: 18px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(4, 58, 96, 0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 100%; max-width: 300px; border-radius: 40px; padding: 40px 25px; text-align: center; border-bottom: 8px solid var(--gold); }
    </style>
</head>
<body>

<div class="header-curvy">
    <h2>MAHIKA TRANS</h2>
    <p>Input Pengiriman Paket</p>
</div>

<div class="form-container">
    <div class="card-input">
        <div class="group-field"><label><i class="fas fa-circle-user"></i> Pengirim</label><input type="text" id="pengirim" placeholder="Nama Pengirim"></div>
        <div class="group-field"><label><i class="fab fa-whatsapp"></i> No HP Pengirim</label><input type="tel" id="wa_pengirim" placeholder="0812..."></div>
        <hr style="border:0; border-top:1px dashed #eee; margin:20px 0;">
        
        <div class="group-field"><label><i class="fas fa-user"></i> Penerima</label><input type="text" id="penerima" placeholder="Nama Penerima"></div>
        <div class="group-field"><label><i class="fas fa-phone"></i> No HP Penerima</label><input type="tel" id="wa_penerima" placeholder="0812..."></div>
        <div class="group-field"><label><i class="fas fa-map-marker-alt"></i> Tujuan</label><input type="text" id="tujuan" placeholder="Kota Tujuan / Alamat"></div>
        
        <div class="row-flex">
            <div class="group-field half"><label><i class="fas fa-boxes"></i> Jumlah Barang</label><input type="text" id="jumlah" placeholder="Contoh: 2 Koli / 5 Kg"></div>
            <div class="group-field half"><label><i class="fa-solid fa-rupiah-sign"></i> Harga</label><input type="number" id="harga" placeholder="150000"></div>
        </div>
        
        <div class="row-flex">
            <div class="group-field half"><label><i class="fas fa-calendar"></i> Tanggal</label><input type="date" id="tgl"></div>
            <div class="group-field half"><label><i class="fas fa-clock"></i> Jam</label><input type="text" id="jam" placeholder="19:00"></div>
        </div>
        
        <button id="btnSimpan" class="btn-save">SIMPAN & KIRIM RESI</button>
    </div>
</div>

<div id="modalSukses" class="modal">
    <div class="modal-content">
        <i class="fas fa-check-circle" style="color:var(--gold); font-size:70px; margin-bottom:15px;"></i>
        <h3 style="font-weight:700; margin:0; color: var(--primary-blue);">BERHASIL!</h3>
        <p style="font-size:12px; color:#777; margin-bottom:25px;">Resi paket telah tersimpan.</p>
        <a id="linkWA" href="#" target="_blank" style="display:block; background:var(--primary-blue); color:white; padding:16px; border-radius:15px; text-decoration:none; font-weight:700; margin-bottom:10px;">KIRIM WA</a>
        <button onclick="location.reload()" style="background:none; border:none; color:var(--primary-blue); font-size:11px; font-weight:600; cursor:pointer;">INPUT BARU</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAmTAWHcHpolaIHegLceyMqExVgzufJzaU", 
        authDomain: "mahika-trans.firebaseapp.com", 
        projectId: "mahika-trans", 
        appId: "1:1087881066133:web:148d51c88f1de3466ecd9c" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('tgl').valueAsDate = new Date();

    document.getElementById('btnSimpan').onclick = async function() {
        const vPengirim = document.getElementById('pengirim').value;
        const vWA = document.getElementById('wa_pengirim').value;
        const vPenerima = document.getElementById('penerima').value;
        
        if(!vPengirim || !vWA) return alert("Data Pengirim wajib diisi!");

        const randomNumber = Math.floor(100000 + Math.random() * 900000).toString();
        const fullID = "MT-" + randomNumber;

        try {
            await setDoc(doc(db, "packages", randomNumber), {
                pengirim: vPengirim,
                wa_pengirim: vWA,
                penerima: vPenerima,
                wa_penerima: document.getElementById('wa_penerima').value,
                tujuan: document.getElementById('tujuan').value,
                jumlah: document.getElementById('jumlah').value,
                harga: document.getElementById('harga').value,
                tgl: document.getElementById('tgl').value,
                jam: document.getElementById('jam').value + " WIB",
                createdAt: serverTimestamp()
            });

            const linkResi = `https://go.mahikatrans.my.id/${randomNumber}`;
            const textWA = `Halo, *${vPengirim}*..%0A` +
                           `Berikut adalah Resi Pengiriman Mahika Trans.%0A%0A` +
                           `No. Resi: *${fullID}*%0A` +
                           `Penerima: ${vPenerima}%0A` +
                           `----------------------------------------%0A` +
                           `${linkResi}%0A` +
                           `----------------------------------------%0A` +
                           `Terimakasih.`;

            let formattedWA = vWA.startsWith('0') ? '62' + vWA.substring(1) : vWA;
            document.getElementById('linkWA').href = `https://wa.me/${formattedWA}?text=${textWA}`;
            document.getElementById('modalSukses').style.display = 'flex';
        } catch (e) { alert(e.message); }
    }
</script>
</body>
</html>
