<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denah Kursi Mahika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --deep-blue: #053a6f; 
            --mahika-yellow: #facc15; 
            --card-white: #ffffff;
        }

        body { 
            background-color: var(--deep-blue); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .bg-deep { 
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%); 
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Header Logo */
        .header {
            padding: 40px 20px 60px 20px;
            text-align: center;
        }

        .header img {
            max-width: 150px; /* Sesuaikan ukuran logo */
            height: auto;
        }

        /* Card Denah */
        .ticket-card {
            background: var(--card-white);
            margin: -30px 20px 20px 20px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        /* Container Denah */
        .bus-container {
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            padding: 20px;
            background: #fafafa;
        }

        .steering-section {
            display: flex;
            justify-content: flex-end; /* Sopir Kanan */
            margin-bottom: 20px;
            padding-right: 5px;
        }

        .steering-wheel {
            width: 35px; height: 35px;
            border: 4px solid var(--deep-blue);
            border-radius: 50%;
            position: relative;
            opacity: 0.8;
        }

        /* Grid Kursi */
        .grid-seats {
            display: grid;
            grid-template-columns: 1fr 1fr 35px 1fr 1fr;
            gap: 12px 10px;
        }

        .seat {
            aspect-ratio: 1/1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            background: white;
            color: var(--deep-blue);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .seat:hover {
            border-color: var(--mahika-yellow);
            background: #fffdf0;
        }

        .aisle { grid-column: 3; }

        /* Row Belakang */
        .back-row {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 2fr 35px 1fr 1fr;
            gap: 10px;
        }

        .toilet {
            grid-column: 1 / span 2;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            color: #64748b;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 800;
            text-transform: uppercase;
        }

        /* Tombol Polos */
        .btn-action {
            background: var(--mahika-yellow);
            width: calc(100% - 40px);
            margin: 10px 20px;
            padding: 22px; /* Lebih tebal karena tidak ada teks */
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
            transition: transform 0.1s;
        }

        .btn-action:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="bg-deep">
    <div class="header">
        <img src="/logo.png" alt="Logo">
    </div>

    <div class="ticket-card">
        <div class="bus-container">
            <div class="steering-section">
                <div class="steering-wheel"></div>
            </div>

            <div class="grid-seats">
                <div class="seat">1</div><div class="seat">2</div>
                <div class="aisle"></div>
                <div class="seat">3</div><div class="seat">4</div>

                <div class="seat">5</div><div class="seat">6</div>
                <div class="aisle"></div>
                <div class="seat">7</div><div class="seat">12</div>

                <div class="seat">9</div><div class="seat">10</div>
                <div class="aisle"></div>
                <div class="seat">15</div><div class="seat">16</div>

                <div class="seat">17</div><div class="seat">18</div>
                <div class="aisle"></div>
                <div class="seat">19</div><div class="seat">20</div>

                <div class="seat">21</div><div class="seat">22</div>
                <div class="aisle"></div>
                <div class="seat">23</div><div class="seat">24</div>

                <div class="seat">25</div><div class="seat">26</div>
                <div class="aisle"></div>
                <div class="seat">27</div><div class="seat">38</div>
            </div>

            <div class="back-row">
                <div class="toilet">TOILET</div>
                <div class="aisle"></div>
                <div class="seat">31</div>
                <div class="seat">32</div>
            </div>
        </div>
    </div>

    <button class="btn-action"></button>
</div>

</body>
</html>
