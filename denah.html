<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denah Kursi Bus Minimalis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --text-dark: #1e3a8a;
            --border-color: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #dbeafe; display: flex; justify-content: center; padding: 20px; }

        .phone-screen {
            width: 100%;
            max-width: 375px;
            background: #f3f4f6;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        /* Header Logo */
        .header {
            background-color: var(--primary-blue);
            padding: 25px 20px 60px 20px;
            text-align: center;
        }

        .logo-placeholder {
            color: white;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Card Tiket */
        .ticket-card {
            background: white;
            margin: -35px 15px 20px 15px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .card-title {
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        /* Area Denah Bus */
        .bus-layout {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }

        .steering-section {
            display: flex;
            justify-content: flex-end; /* Sopir Kanan */
            margin-bottom: 15px;
        }

        .steering-wheel {
            width: 32px; height: 32px;
            border: 3px solid #4b5563;
            border-radius: 50%;
            position: relative;
        }
        .steering-wheel::after {
            content: ""; position: absolute; width: 15px; height: 3px; background: #4b5563; top: 12px; left: 5px;
        }

        /* Grid Kursi sesuai Gambar (1-2-3-4, dst) */
        .grid-seats {
            display: grid;
            grid-template-columns: 1fr 1fr 30px 1fr 1fr;
            gap: 10px 8px;
        }

        .seat {
            aspect-ratio: 1/1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border: 1.5px solid #d1d5db;
            background: #f9fafb;
            color: #374151;
            cursor: pointer;
        }

        /* State untuk Booked (sesuai gambar: merah/booked) */
        .seat.booked {
            background: #f87171;
            border-color: #dc2626;
            color: white;
            font-size: 9px;
            font-weight: 400;
        }

        .aisle { grid-column: 3; }

        /* Row Belakang */
        .back-row {
            margin-top: 10px;
            display: grid;
            grid-template-columns: 2fr 30px 1fr 1fr;
            gap: 8px;
        }

        .toilet {
            grid-column: 1 / span 2;
            background: #e5e7eb;
            border: 1.5px solid #9ca3af;
            color: #374151;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700;
        }

        .btn-confirm {
            background: var(--primary-blue);
            color: white;
            width: calc(100% - 30px);
            margin: 0 15px 25px 15px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="phone-screen">
    <div class="header">
        <div class="logo-placeholder">LOGO.PNG</div>
    </div>

    <div class="ticket-card">
        <h2 class="card-title">EKSEKUTIF 32 SEAT</h2>
        
        <div class="bus-layout">
            <div class="steering-section">
                <div class="steering-wheel"></div>
            </div>

            <div class="grid-seats">
                <div class="seat">1</div>
                <div class="seat">2</div>
                <div class="aisle"></div>
                <div class="seat">3</div>
                <div class="seat">4</div>

                <div class="seat">5</div>
                <div class="seat">6</div>
                <div class="aisle"></div>
                <div class="seat booked">booked</div>
                <div class="seat">12</div>

                <div class="seat">9</div>
                <div class="seat">10</div>
                <div class="aisle"></div>
                <div class="seat">15</div>
                <div class="seat">16</div>

                <div class="seat">17</div>
                <div class="seat">18</div>
                <div class="aisle"></div>
                <div class="seat">19</div>
                <div class="seat">20</div>

                <div class="seat">21</div>
                <div class="seat">22</div>
                <div class="aisle"></div>
                <div class="seat">23</div>
                <div class="seat">24</div>

                <div class="seat">25</div>
                <div class="seat">26</div>
                <div class="aisle"></div>
                <div class="seat">27</div>
                <div class="seat">38</div>
            </div>

            <div class="back-row">
                <div class="toilet">TOILET</div>
                <div class="aisle"></div>
                <div class="seat booked" style="font-size: 14px; font-weight: 700;">31</div>
                <div class="seat booked" style="font-size: 14px; font-weight: 700;">32</div>
            </div>
        </div>
    </div>

    <button class="btn-confirm">PILIH KURSI</button>
</div>

</body>
</html>
