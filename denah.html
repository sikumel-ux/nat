<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denah Kursi Mahika - Card Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --deep-blue: #053a6f; 
            --mahika-yellow: #facc15; 
            --card-white: #ffffff;
        }

        body { 
            background-color: var(--deep-blue); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center; /* Center vertikal biar makin keliatan card-nya */
            min-height: 100vh;
        }

        .bg-deep { 
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%); 
            width: 100%;
            max-width: 414px; /* Standar layar HP modern */
            height: 90vh; /* Sisakan sedikit space di atas bawah */
            border-radius: 40px; /* Bentuk HP */
            overflow-y: auto;
            position: relative;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* Header Logo - Area Biru */
        .header {
            padding: 50px 20px 80px 20px;
            text-align: center;
        }

        .header img {
            max-width: 140px;
            height: auto;
        }

        /* INI KUNCI CARD-BASED UI */
        .ticket-card {
            background: var(--card-white);
            margin: -40px 25px 20px 25px; /* Margin kiri-kanan lebih lebar biar keliatan 'floating' */
            border-radius: 28px;
            padding: 25px;
            /* Shadow lebih soft tapi tebel biar kesan melayang dapet */
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            z-index: 10;
        }

        /* Container Denah di dalam Card */
        .bus-container {
            border: 1.5px solid #f1f5f9;
            border-radius: 20px;
            padding: 15px;
            background: #ffffff;
        }

        .steering-section {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .steering-wheel {
            width: 35px; height: 35px;
            border: 4px solid var(--deep-blue);
            border-radius: 50%;
            opacity: 0.6;
        }

        .grid-seats {
            display: grid;
            grid-template-columns: 1fr 1fr 30px 1fr 1fr;
            gap: 12px 8px;
        }

        .seat {
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #edf2f7;
            background: #fff;
            color: var(--deep-blue);
            cursor: pointer;
            transition: all 0.2s;
        }

        .seat:hover {
            border-color: var(--mahika-yellow);
            transform: translateY(-2px);
        }

        .aisle { grid-column: 3; }

        .back-row {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 2fr 30px 1fr 1fr;
            gap: 8px;
        }

        .toilet {
            grid-column: 1 / span 2;
            background: #f8fafc;
            border: 2px solid #edf2f7;
            color: #94a3b8;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800;
            text-transform: uppercase;
        }

        /* Tombol Mahika */
        .btn-action {
            background: var(--mahika-yellow);
            width: calc(100% - 50px);
            margin: 10px 25px 30px 25px;
            padding: 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(250, 204, 21, 0.2);
            transition: 0.2s;
        }

        .btn-action:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 25px rgba(250, 204, 21, 0.3);
        }
    </style>
</head>
<body>

<div class="bg-deep">
    <div class="header">
        <img src="/logo.png" alt="Mahika Logo">
    </div>

    <div class="ticket-card">
        <div class="bus-container">
            <div class="steering-section">
                <div class="steering-wheel"></div>
            </div>

            <div class="grid-seats">
                <div class="seat">1</div><div class="seat">2</div><div class="aisle"></div><div class="seat">3</div><div class="seat">4</div>
                <div class="seat">5</div><div class="seat">6</div><div class="aisle"></div><div class="seat">7</div><div class="seat">12</div>
                <div class="seat">9</div><div class="seat">10</div><div class="aisle"></div><div class="seat">15</div><div class="seat">16</div>
                <div class="seat">17</div><div class="seat">18</div><div class="aisle"></div><div class="seat">19</div><div class="seat">20</div>
                <div class="seat">21</div><div class="seat">22</div><div class="aisle"></div><div class="seat">23</div><div class="seat">24</div>
                <div class="seat">25</div><div class="seat">26</div><div class="aisle"></div><div class="seat">27</div><div class="seat">38</div>
            </div>

            <div class="back-row">
                <div class="toilet">TOILET</div>
                <div class="aisle"></div>
                <div class="seat">31</div>
                <div class="seat">32</div>
            </div>
        </div>
    </div>

    <button class="btn-action"></button>
</div>

</body>
</html>
