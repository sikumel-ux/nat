<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Reservasi | Mahika Trans</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065084">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <style>
        :root { 
            --primary-blue: #065084; 
            --bg-darker: #043a60; 
            --gold: #FFD700; 
            --white-gading: #fffdf5; 
        }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding-bottom: 100px; color: #333; overflow-x: hidden; }
        
        /* HEADER & FORM */
        .header-curvy { background: linear-gradient(135deg, var(--bg-darker), var(--primary-blue)); padding: 50px 25px 80px 25px; border-radius: 0 0 50px 50px; text-align: center; }
        .header-curvy h2 { color: var(--gold); font-weight: 700; font-size: 24px; margin: 0; text-transform: uppercase; }
        .form-container { margin-top: -50px; padding: 0 20px; position: relative; z-index: 10; }
        .card-input { background: white; border-radius: 30px; padding: 30px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid var(--gold); }
        .group-field { margin-bottom: 18px; }
        .group-field label { display: block; font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 6px; }
        .group-field input { width: 100%; border: 1.5px solid #eee; padding: 14px; border-radius: 15px; font-family: 'Poppins'; font-size: 13px; box-sizing: border-box; }
        .row-flex { display: flex; gap: 15px; }
        .half { flex: 1; }
        .btn-save { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 18px; border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-save:active { transform: scale(0.95); background: var(--bg-darker); }

        /* MODAL BERHASIL - TEMA MAHIKA */
        .modal { display: none; position: fixed; inset: 0; background: rgba(4, 58, 96, 0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal-content { 
            background: white; width: 100%; max-width: 300px; border-radius: 40px; 
            padding: 40px 25px; text-align: center; position: relative;
            border-bottom: 8px solid var(--gold);
        }
        .icon-check { color: var(--gold); font-size: 80px; margin-bottom: 15px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }
        .btn-modal { display: block; width: 100%; padding: 16px; border-radius: 15px; font-size: 13px; font-weight: 700; text-decoration: none; margin-bottom: 12px; text-transform: uppercase; box-sizing: border-box; }
        .btn-wa { background: var(--primary-blue); color: white; box-shadow: 0 5px 15px rgba(6, 80, 132, 0.3); }
        .btn-manifes { background: #f0f4f8; color: #666; }

        /* ERROR SCREEN */
        #error-screen { 
            position: fixed; inset: 0; background: var(--primary-blue); 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10000; text-align: center; color: var(--white-gading); overflow: hidden;
        }
        .bus-shake { font-size: 100px; color: var(--gold); animation: busGoyang 1s infinite alternate ease-in-out; margin-bottom: 20px; }
        @keyframes busGoyang { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
        
        .particle { position: absolute; background: rgba(255,255,255,0.2); border-radius: 50%; pointer-events: none; animation: float 10s infinite linear; }
        @keyframes float { from { transform: translateY(100vh); } to { transform: translateY(-10vh); } }

        .btn-wa-error { 
            background: var(--white-gading); color: var(--primary-blue); 
            padding: 15px 30px; border-radius: 50px; text-decoration: none; 
            font-weight: 700; margin-top: 20px; display: inline-flex; align-items: center; gap: 10px;
        }
    </style>
</head>
<body>

<div id="app-content">
    <div class="header-curvy"><h2>INPUT BOOKING</h2></div>
    <div class="form-container">
        <div class="card-input">
            <div class="group-field"><label>Nama Penumpang</label><input type="text" id="nama" placeholder="Nama lengkap"></div>
            <div class="row-flex">
                <div class="group-field half"><label>No. WhatsApp</label><input type="tel" id="whatsapp" placeholder="0812..."></div>
                <div class="group-field half"><label>Kursi</label><input type="text" id="kursi" placeholder="1A"></div>
            </div>
            <div class="group-field"><label>Armada</label><input type="text" id="armada" placeholder="Mahika Jaya"></div>
            <div class="group-field"><label>Tujuan</label><input type="text" id="tujuan" placeholder="Kota Tujuan"></div>
            <div class="group-field"><label>Harga</label><input type="number" id="harga" placeholder="250000"></div>
            <div class="row-flex">
                <div class="group-field half"><label>Tanggal</label><input type="date" id="tgl_only"></div>
                <div class="group-field half"><label>Jam</label><input type="text" id="jam_only" placeholder="17:30"></div>
            </div>
            <button id="btnSimpan" class="btn-save">SIMPAN & KIRIM TIKET</button>
        </div>
    </div>
</div>

<div id="modalSukses" class="modal">
    <div class="modal-content">
        <i class="fas fa-certificate icon-check"></i>
        <h3 style="font-weight:700; margin:0; color: var(--primary-blue);">BERHASIL!</h3>
        <p style="font-size:12px; color:#777; margin-bottom:25px;">Data reservasi telah tersimpan.</p>
        
        <a id="linkWA" href="#" target="_blank" class="btn-modal btn-wa">
            <i class="fab fa-whatsapp"></i> KIRIM KE PENUMPANG
        </a>
        <a href="pwa-manifes.html" class="btn-modal btn-manifes">BUKA MANIFES</a>
        
        <button onclick="location.reload()" style="background:none; border:none; color:var(--primary-blue); font-size:11px; font-weight:600; cursor:pointer; margin-top:10px; text-transform:uppercase;">Input Data Baru</button>
    </div>
</div>

<div id="error-screen">
    <div id="particles-container"></div>
    <i class="fas fa-bus bus-shake"></i>
    <h2 style="font-weight: 700; margin: 0 20px;">MAAF, KODE BOOKING TIDAK VALID</h2>
    <p style="opacity: 0.8; margin-top: 10px;">Silahkan hubungi admin Mahika Trans.</p>
    <a href="https://wa.me/628123456789" class="btn-wa-error">
        <i class="fab fa-whatsapp"></i> HUBUNGI ADMIN
    </a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAmTAWHcHpolaIHegLceyMqExVgzufJzaU", 
        authDomain: "mahika-trans.firebaseapp.com", 
        projectId: "mahika-trans", 
        storageBucket: "mahika-trans.firebasestorage.app", 
        appId: "1:1087881066133:web:148d51c88f1de3466ecd9c" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- LOGIKA PATH URL ---
    const path = window.location.pathname.split("/").pop().toUpperCase();
    if (path.startsWith("MT-")) {
        const ticketID = path.replace("MT-", "");
        const docRef = doc(db, "bookings", ticketID);
        getDoc(docRef).then((snap) => {
            if (!snap.exists()) {
                tampilkanError();
            } else {
                // Redirect ke halaman etiket utama dengan ID
                window.location.href = "https://mahikatrans.my.id/etiket/?id=MT-" + ticketID;
            }
        });
    }

    function tampilkanError() {
        document.getElementById('app-content').style.display = 'none';
        document.getElementById('error-screen').style.display = 'flex';
        const container = document.getElementById('particles-container');
        for (let i = 0; i < 25; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.width = p.style.height = Math.random() * 4 + 2 + 'px';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            container.appendChild(p);
        }
    }

    // --- SIMPAN DATA ---
    document.getElementById('tgl_only').valueAsDate = new Date();

    document.getElementById('btnSimpan').onclick = async function() {
        const btn = this;
        const vNama = document.getElementById('nama').value;
        const vWA = document.getElementById('whatsapp').value;
        const vKursi = document.getElementById('kursi').value;
        const vArmada = document.getElementById('armada').value;
        const vTujuan = document.getElementById('tujuan').value;
        const vHarga = document.getElementById('harga').value;
        const vTglRaw = document.getElementById('tgl_only').value;
        const vJamRaw = document.getElementById('jam_only').value;

        if(!vNama || !vWA) return alert("Lengkapi Nama & WA!");

        btn.innerText = "SEDANG MENYIMPAN...";
        btn.disabled = true;

        const randomID = Math.floor(100000 + Math.random() * 900000).toString();
        const bookingID = "MT-" + randomID;

        try {
            await setDoc(doc(db, "bookings", randomID), {
                nama: vNama, wa: vWA, kursi: vKursi, armada: vArmada,
                tujuan: vTujuan, harga: vHarga, tgl: vTglRaw, jam: vJamRaw + " WIB",
                createdAt: serverTimestamp()
            });

            const linkEtiket = `https://go.mahikatrans.my.id/${bookingID}`;

            const textWA = `Halo, *${vNama}*..%0ABerikut adalah data pemesanan tiket Anda.%0A%0A` +
                           `Kode Booking: *${bookingID}*%0A` +
                           `Tujuan: ${vTujuan}%0A` +
                           `Kursi: ${vKursi}%0A%0A` +
                           `Cek Tiket Digital Anda di sini:%0A${linkEtiket}`;

            let formattedWA = vWA.startsWith('0') ? '62' + vWA.substring(1) : vWA;
            document.getElementById('linkWA').href = `https://wa.me/${formattedWA}?text=${textWA}`;
            document.getElementById('modalSukses').style.display = 'flex';
        } catch (e) { alert("Error: " + e.message); }
        finally { btn.innerText = "SIMPAN & KIRIM TIKET"; btn.disabled = false; }
    }
</script>
</body>
</html>
