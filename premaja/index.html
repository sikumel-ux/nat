<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Tiket Putra Remaja</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-section">
        <div class="brand-container">
            <h1 class="title-brand"><span class="brand-mahika">CARI</span><span class="brand-trans">Tiket</span></h1>
            <p class="subtitle">P.O PUTRA REMAJA</p>
        </div>
    </div>

    <div class="main-container">
        <div class="search-card">
            <div class="form-group">
                <label>Mau Pergi Ke Mana?</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" id="routeInput" placeholder="Ketik rute tujuan..." autocomplete="off">
                </div>
                <div id="suggestionBox" class="suggestions"></div>
            </div>

            <div class="form-group">
                <label>Periode Tanggal</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-days"></i>
                    <select id="selectDate">
                        <option value="0">14 - 20 Maret 2026</option>
                        <option value="1">23 - 25 Maret 2026</option>
                        <option value="2">26 Mar - 06 Apr (PUNCAK)</option>
                        <option value="3">07 - 13 April 2026</option>
                        <option value="4">14 - 19 April 2026</option>
                    </select>
                </div>
            </div>

            <button class="btn-search" id="searchBtn">LIHAT HARGA</button>

            <div id="resultArea" class="hidden">
                <div class="result-card">
                    <div id="resTags"></div>
                    <p class="label-price">Harga Tiket:</p>
                    <h2 class="res-price" id="outPrice">Rp 0</h2>
                    <p class="res-route-detail" id="outRouteName"></p>
                </div>
            </div>
        </div>

        <div class="action-area">
            <p class="action-label">Informasi & Reservasi</p>
            <a href="https://wa.me/6281211407667" target="_blank" class="btn-whatsapp" id="waLink">
                <i class="fa-brands fa-whatsapp"></i>
                <span>PESAN VIA WHATSAPP</span>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
