<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Tiket Putra Remaja</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --deep-blue: #053a6f; 
            --mahika-yellow: #facc15; 
            --light-bg: #f3f4f6;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background-color: var(--light-bg); font-family: 'Plus Jakarta Sans', sans-serif; color: #334155; }

        .top-section {
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%);
            height: 150px; display: flex; flex-direction: column; align-items: center; padding-top: 25px;
        }

        .title-brand {
            font-size: 32px; font-weight: 800; letter-spacing: -2px; margin: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .brand-mahika { color: var(--mahika-yellow); }
        .brand-trans { color: #fdfaf0; font-weight: 200; }

        .main-container {
            max-width: 400px; margin: -50px auto 40px auto; padding: 0 15px; position: relative; z-index: 10;
        }

        .search-card {
            background: white; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); padding: 20px;
        }

        .form-group { margin-bottom: 12px; position: relative; }
        label { display: block; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }

        input, select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #f1f5f9;
            background-color: #f8fafc; font-family: inherit; font-weight: 600; color: var(--deep-blue); font-size: 13px;
        }

        /* Suggestion Box */
        .suggestions {
            position: absolute; width: 100%; background: white; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 100; max-height: 200px; overflow-y: auto;
            border: 1px solid #f1f5f9; display: none; margin-top: 5px;
        }
        .suggestion-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f8fafc; font-size: 12px; }
        .suggestion-item:hover { background: #eff6ff; color: var(--deep-blue); }

        .btn-search {
            width: 100%; padding: 14px; background: var(--deep-blue); color: white; border: none;
            border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px;
        }

        #resultArea { margin-top: 15px; display: none; }
        .result-card {
            background: #fdfaf0; border: 2px solid var(--mahika-yellow); border-radius: 18px; padding: 16px; text-align: center;
        }
        .res-price { font-size: 28px; font-weight: 800; color: var(--deep-blue); margin: 5px 0; }
        .tag { font-size: 9px; font-weight: 700; background: var(--deep-blue); color: white; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="brand-container">
            <h1 class="title-brand"><span class="brand-mahika">CARI</span><span class="brand-trans">Tiket</span></h1>
        </div>
    </div>

    <div class="main-container">
        <div class="search-card">
            <div class="form-group">
                <label>Mau Pergi Ke Mana?</label>
                <input type="text" id="routeInput" placeholder="Ketik rute (misal: Metro atau Jambi)" autocomplete="off">
                <div id="suggestionBox" class="suggestions"></div>
            </div>

            <div class="form-group">
                <label>Periode Tanggal</label>
                <select id="selectDate">
                    <option value="0">14 - 20 Maret 2026</option>
                    <option value="1">23 - 25 Maret 2026</option>
                    <option value="2">26 Maret - 06 April 2026 (PUNCAK)</option>
                    <option value="3">07 - 13 April 2026</option>
                    <option value="4">14 - 19 April 2026</option>
                </select>
            </div>

            <button class="btn-search" onclick="calculate()">CEK HARGA SEKARANG</button>

            <div id="resultArea">
                <div class="result-card">
                    <div id="resTags" style="margin-bottom: 8px;"></div>
                    <div style="font-size: 11px; color: #64748b;">Harga Tiket:</div>
                    <div class="res-price" id="outPrice">Rp 0</div>
                    <div style="font-size: 10px; color: #94a3b8;" id="outRouteName"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Database rute yang sudah dipisah satu per satu sesuai foto
        const routes = [
            // Executive
            { n: "Lampung", p: ["550k", "600k", "700k", "600k", "Norm"], c: "Exec" },
            { n: "Metro", p: ["550k", "600k", "700k", "600k", "Norm"], c: "Exec" },
            { n: "Pringsewu", p: ["550k", "600k", "700k", "600k", "Norm"], c: "Exec" },
            { n: "Bandar Jaya", p: ["550k", "600k", "700k", "600k", "Norm"], c: "Exec" },
            { n: "Unit 2", p: ["550k", "600k", "700k", "600k", "Norm"], c: "Exec" },
            { n: "Kotabumi", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Way Abung", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Gaya Baru", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Sri Kencono", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Rumbia", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Way Jepara", p: ["600k", "650k", "750k", "650k", "Norm"], c: "Exec" },
            { n: "Tulang Bawang", p: ["600k", "650k", "750k", "700k", "600k"], c: "Exec" },
            { n: "Palembang", p: ["650k", "700k", "800k", "750k", "650k"], c: "Exec" },
            { n: "Jambi", p: ["750k", "800k", "900k", "850k", "800k"], c: "Exec" },
            { n: "Lubuk Linggau", p: ["850k", "900k", "1000k", "950k", "900k"], c: "Exec" },
            { n: "Muara Bungo", p: ["900k", "950k", "1050k", "1000k", "950k"], c: "Exec" },
            { n: "Sungai Rumbai", p: ["950k", "1000k", "1100k", "1050k", "1000k"], c: "Exec" },
            // Super Executive (Hanya rute yang ada di foto 2)
            { n: "Palembang (Super Executive)", p: ["850k", "900k", "1000k", "950k", "900k"], c: "Super Exec" },
            { n: "Jambi (Super Executive)", p: ["900k", "950k", "1100k", "1050k", "950k"], c: "Super Exec" },
            { n: "Lubuk Linggau (Super Executive)", p: ["1000k", "1050k", "1200k", "1150k", "1050k"], c: "Super Exec" }
        ];

        const input = document.getElementById('routeInput');
        const sBox = document.getElementById('suggestionBox');
        let selectedRoute = null;

        input.addEventListener('input', () => {
            const val = input.value.toLowerCase();
            sBox.innerHTML = '';
            if (!val) { sBox.style.display = 'none'; return; }

            const filtered = routes.filter(r => r.n.toLowerCase().includes(val));
            if (filtered.length > 0) {
                sBox.style.display = 'block';
                filtered.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = `${r.n} (${r.c})`;
                    div.onclick = () => {
                        input.value = r.n;
                        selectedRoute = r;
                        sBox.style.display = 'none';
                    };
                    sBox.appendChild(div);
                });
            } else {
                sBox.style.display = 'none';
            }
        });

        function calculate() {
            if (!selectedRoute) { alert('Pilih rute dari saran yang muncul ya!'); return; }
            
            const dateIdx = document.getElementById('selectDate').value;
            const price = selectedRoute.p[dateIdx];
            
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('outPrice').innerText = price === "Norm" ? "TARIF NORMAL" : "Rp " + price;
            document.getElementById('outRouteName').innerText = "Tujuan: " + selectedRoute.n;
            document.getElementById('resTags').innerHTML = `<span class="tag">${selectedRoute.c}</span>`;
        }

        // Tutup box kalau klik di luar
        document.addEventListener('click', (e) => { if (e.target !== input) sBox.style.display = 'none'; });
    </script>
</body>
</html>
