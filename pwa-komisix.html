<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Komisi | Mahika Trans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-blue: #065084; 
            --bg-darker: #043a60; 
            --gold: #FFD700; 
            --white-gading: #fffdf5;
            --orange-paket: #e67e22;
        }
        body { font-family: 'Poppins', sans-serif; background: #f0f4f8; margin: 0; padding-bottom: 100px; color: #333; }
        
        .header { background: linear-gradient(135deg, var(--bg-darker), var(--primary-blue)); padding: 40px 20px 60px; border-radius: 0 0 40px 40px; color: white; text-align: center; }
        .header h2 { margin: 0; font-size: 20px; color: var(--gold); letter-spacing: 1px; }
        
        .filter-section { margin: -30px 20px 20px; background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .filter-section label { display: block; font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 8px; margin-left: 5px; }
        .filter-section input { width: 100%; border: 1.5px solid #f0f0f0; padding: 12px 15px; border-radius: 15px; font-family: 'Poppins'; font-size: 14px; box-sizing: border-box; outline: none; background: #f9f9f9; }

        .summary-card { margin: 0 20px 25px; background: var(--primary-blue); color: white; padding: 25px; border-radius: 25px; display: flex; align-items: center; justify-content: space-between; position: relative; overflow: hidden; }
        .summary-info h3 { margin: 0; font-size: 11px; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; }
        .summary-info p { margin: 5px 0 0; font-size: 26px; font-weight: 700; color: var(--gold); }
        .summary-card i { font-size: 35px; color: var(--gold); opacity: 0.3; }

        .list-container { padding: 0 20px; }
        .list-header { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 15px; padding-left: 5px; display: flex; justify-content: space-between; }
        
        .item-komisi { background: white; padding: 18px; border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); border-left: 4px solid var(--primary-blue); cursor: pointer; }
        .item-left h4 { margin: 0; font-size: 14px; color: #333; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .item-left p { margin: 4px 0 0; font-size: 11px; color: #888; }
        .item-right { text-align: right; }
        .amount { display: block; font-weight: 700; color: #27ae60; font-size: 15px; }
        .edit-label { font-size: 9px; color: var(--primary-blue); font-weight: 700; text-transform: uppercase; }

        /* Modal Style */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 100%; max-width: 350px; border-radius: 30px; padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; font-size: 18px; color: var(--primary-blue); margin-bottom: 20px; }
        .modal-field { margin-bottom: 15px; }
        .modal-field label { display: block; font-size: 11px; font-weight: 700; color: #999; margin-bottom: 6px; }
        .modal-field input, .modal-field select { width: 100%; padding: 12px 15px; border: 1.5px solid #eee; border-radius: 12px; font-family: 'Poppins'; outline: none; box-sizing: border-box; font-size: 14px; background: #f9f9f9; }
        
        .btn-update { width: 100%; background: var(--primary-blue); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 700; cursor: pointer; font-family: 'Poppins'; margin-top: 10px; }
        .btn-close { position: absolute; top: 20px; right: 20px; color: #ccc; border: none; background: none; font-size: 20px; cursor: pointer; }

        /* Floating Button */
        .fab-add { position: fixed; bottom: 90px; right: 20px; width: 55px; height: 55px; background: var(--gold); color: var(--primary-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 90; border: none; cursor: pointer; }

        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 100; }
        .nav-bottom a { text-decoration: none; color: #bbb; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-bottom a.active { color: var(--primary-blue); }
        .nav-bottom i { font-size: 20px; }
        
        /* Icon box style */
        .icon-box { background: #fff4e5; color: var(--orange-paket); padding: 4px; border-radius: 6px; font-size: 10px; }
        .icon-user { background: #e5f1ff; color: var(--primary-blue); padding: 4px; border-radius: 6px; font-size: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2 id="judulBulan">LAPORAN KOMISI</h2>
    <p>Mahika Trans Management</p>
</div>

<div class="filter-section">
    <label>Pilih Periode</label>
    <input type="month" id="filterBulan">
</div>

<div class="summary-card">
    <div class="summary-info">
        <h3 id="txtPeriode">Komisi Bulan Ini</h3>
        <p id="totalNominal">Rp 0</p>
    </div>
    <i class="fas fa-wallet"></i>
</div>

<div class="list-container">
    <div class="list-header">
        <span>Riwayat Komisi</span>
        <span id="countData">0 Data</span>
    </div>
    <div id="listKomisi"></div>
</div>

<button class="fab-add" id="btnBukaTambah">
    <i class="fas fa-plus"></i>
</button>

<div id="modalTambah" class="modal">
    <div class="modal-content">
        <button class="btn-close" onclick="closeModal('modalTambah')">&times;</button>
        <h3>Tambah Komisi</h3>
        <div class="modal-field">
            <label>Tanggal</label>
            <input type="date" id="addTgl">
        </div>
        <div class="modal-field">
            <label>Nama / Keterangan</label>
            <input type="text" id="addNama" placeholder="Nama penumpang / paket">
        </div>
        <div class="modal-field">
            <label>Tujuan</label>
            <input type="text" id="addTujuan" placeholder="Contoh: Yogyakarta">
        </div>
        <div class="modal-field">
            <label>Kategori</label>
            <select id="addKategori">
                <option value="penumpang">Penumpang</option>
                <option value="paket">Paket (Barang)</option>
            </select>
        </div>
        <div class="modal-field">
            <label>Nominal Komisi (Rp)</label>
            <input type="number" id="addKomisi" placeholder="0">
        </div>
        <button id="btnSimpanManual" class="btn-update">SIMPAN DATA</button>
    </div>
</div>

<div id="modalEdit" class="modal">
    <div class="modal-content">
        <button class="btn-close" onclick="closeModal('modalEdit')">&times;</button>
        <h3>Update Komisi</h3>
        <div class="modal-field">
            <label id="labelNamaEdit">Nama: -</label>
            <input type="number" id="inputKomisiEdit">
        </div>
        <button id="btnUpdateData" class="btn-update">SIMPAN PERUBAHAN</button>
    </div>
</div>

<div class="nav-bottom">
    <a href="pwa-home.html"><i class="fas fa-house"></i>Home</a>
    <a href="pwa-order.html"><i class="fas fa-plus-circle"></i>Booking</a>
    <a href="pwa-manifes.html"><i class="fas fa-list"></i>Manifes</a>
    <a href="pwa-kmsi.html" class="active"><i class="fas fa-wallet"></i>Komisi</a>
    <a href="input-rute.html"><i class="fas fa-route"></i>Rute</a>
    <a href="logout.html" id="logoutBtn" style="color: #ef4444;"><i class="fas fa-power-off"></i>Off</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAmTAWHcHpolaIHegLceyMqExVgzufJzaU", 
        authDomain: "mahika-trans.firebaseapp.com", 
        projectId: "mahika-trans", 
        storageBucket: "mahika-trans.firebasestorage.app", 
        appId: "1:1087881066133:web:148d51c88f1de3466ecd9c" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const filterBulan = document.getElementById('filterBulan');
    const listKomisi = document.getElementById('listKomisi');
    const totalNominal = document.getElementById('totalNominal');
    const countData = document.getElementById('countData');
    const txtPeriode = document.getElementById('txtPeriode');
    
    let currentEditId = null;

    // Format Tanggal
    function formatTglIndo(tglSql) {
        if(!tglSql) return "-";
        const [y, m, d] = tglSql.split('-');
        return `${d}-${m}-${y}`;
    }

    function formatBulanIndo(valMonth) {
        const [y, m] = valMonth.split('-');
        const namaBulan = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        return `${namaBulan[parseInt(m)]} ${y}`;
    }

    // Init Date
    const now = new Date();
    filterBulan.value = now.toISOString().substring(0, 7);

    onAuthStateChanged(auth, (user) => {
        if (user) { fetchKomisi(filterBulan.value); } 
        else { location.href = "login.html"; }
    });

    filterBulan.onchange = () => fetchKomisi(filterBulan.value);

    // Ambil Data
    async function fetchKomisi(bulan) {
        listKomisi.innerHTML = '<div style="text-align:center; padding:20px; font-size:12px; color:#999;">Memuat data...</div>';
        txtPeriode.innerText = "Total " + formatBulanIndo(bulan);
        let total = 0;
        let count = 0;

        try {
            const q = query(
                collection(db, "bookings"),
                where("tgl", ">=", bulan + "-01"),
                where("tgl", "<=", bulan + "-31"),
                orderBy("tgl", "desc")
            );

            const querySnapshot = await getDocs(q);
            listKomisi.innerHTML = "";

            if (querySnapshot.empty) {
                listKomisi.innerHTML = '<div style="text-align:center; padding:40px; color:#ccc; font-size:13px;">Belum ada komisi di bulan ini.</div>';
                totalNominal.innerText = "Rp 0";
                countData.innerText = "0 Data";
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const nominal = parseInt(item.komisi) || 0;
                total += nominal;
                count++;

                // Logika Icon Box
                const isPaket = item.kategori === 'paket';
                const iconHtml = isPaket 
                    ? `<span class="icon-box"><i class="fas fa-box"></i></span>` 
                    : `<span class="icon-user"><i class="fas fa-user"></i></span>`;

                const div = document.createElement('div');
                div.className = 'item-komisi';
                div.onclick = () => openEdit(docSnap.id, item.nama, nominal);
                div.innerHTML = `
                    <div class="item-left">
                        <h4>${item.nama} ${iconHtml}</h4>
                        <p>${formatTglIndo(item.tgl)} • ${item.tujuan || 'Tanpa Tujuan'}</p>
                    </div>
                    <div class="item-right">
                        <span class="amount">Rp ${nominal.toLocaleString('id-ID')}</span>
                        <span class="edit-label"><i class="fas fa-pen"></i> Edit</span>
                    </div>
                `;
                listKomisi.appendChild(div);
            });

            totalNominal.innerText = "Rp " + total.toLocaleString('id-ID');
            countData.innerText = count + " Data";

        } catch (err) {
            console.error(err);
            listKomisi.innerHTML = '<div style="color:red; text-align:center; padding:20px;">Gagal memuat data.</div>';
        }
    }

    // Modal Controls
    window.closeModal = (id) => document.getElementById(id).style.display = 'none';

    // Edit Komisi
    window.openEdit = (id, nama, komisiLama) => {
        currentEditId = id;
        document.getElementById('labelNamaEdit').innerText = "Nama: " + nama;
        document.getElementById('inputKomisiEdit').value = komisiLama;
        document.getElementById('modalEdit').style.display = 'flex';
    };

    document.getElementById('btnUpdateData').onclick = async function() {
        const newKomisi = document.getElementById('inputKomisiEdit').value;
        this.innerText = "PROSES...";
        try {
            await updateDoc(doc(db, "bookings", currentEditId), { komisi: newKomisi });
            closeModal('modalEdit');
            fetchKomisi(filterBulan.value);
        } catch (e) { alert("Gagal: " + e.message); }
        this.innerText = "SIMPAN PERUBAHAN";
    };

    // Tambah Manual
    document.getElementById('btnBukaTambah').onclick = () => {
        document.getElementById('addTgl').value = new Date().toISOString().substring(0, 10);
        document.getElementById('modalTambah').style.display = 'flex';
    };

    document.getElementById('btnSimpanManual').onclick = async function() {
        const data = {
            tgl: document.getElementById('addTgl').value,
            nama: document.getElementById('addNama').value,
            tujuan: document.getElementById('addTujuan').value,
            kategori: document.getElementById('addKategori').value,
            komisi: document.getElementById('addKomisi').value,
            createdAt: new Date()
        };

        if(!data.nama || !data.komisi) return alert("Lengkapi nama & nominal!");

        this.innerText = "MENYIMPAN...";
        this.disabled = true;

        try {
            await addDoc(collection(db, "bookings"), data);
            closeModal('modalTambah');
            fetchKomisi(filterBulan.value);
            // Reset
            document.getElementById('addNama').value = "";
            document.getElementById('addKomisi').value = "";
            document.getElementById('addTujuan').value = "";
        } catch (e) { alert("Error: " + e.message); }
        finally {
            this.innerText = "SIMPAN DATA";
            this.disabled = false;
        }
    };

    document.getElementById('logoutBtn').onclick = (e) => {
        e.preventDefault();
        signOut(auth).then(() => location.href = "login.html");
    }
</script>

</body>
</html>
