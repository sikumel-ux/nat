<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putra Remaja x Mahika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --deep-blue: #053a6f; 
            --mahika-yellow: #facc15; 
            --white-off: #fdfaf0; 
            --light-bg: #f3f4f6;
        }

        * { box-sizing: border-box; font-size: 13px; } /* Global font size diperkecil */
        
        body { 
            margin: 0; 
            background-color: var(--light-bg); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #334155;
        }

        .top-section {
            background: radial-gradient(circle at 50% 0%, #074a8d 0%, #053a6f 100%);
            height: 180px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
        }

        .brand-container { text-align: center; z-index: 5; }
        
        .title-brand {
            font-size: 38px; 
            font-weight: 800; 
            letter-spacing: -2px; 
            margin: 0;
            line-height: 0.85;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-mahika { color: var(--mahika-yellow); }
        .brand-trans { color: var(--white-off); font-weight: 200; }

        .brand-sub { 
            display: block; 
            color: var(--mahika-yellow); 
            font-size: 9px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-top: 5px;
            opacity: 0.9;
        }

        .main-container {
            max-width: 500px;
            margin: -70px auto 20px auto;
            padding: 0 15px;
            position: relative;
            z-index: 10;
        }

        .price-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            padding: 16px;
        }

        /* Tab Switcher */
        .tabs {
            display: flex;
            gap: 5px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-weight: 700;
            font-size: 11px;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--deep-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Table Area */
        .table-container {
            max-height: 400px; /* Batas tinggi biar ga scrolling body */
            overflow-y: auto;
            border: 1px solid #f1f5f9;
            border-radius: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            padding: 10px;
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            border-bottom: 1px solid #f1f5f9;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #f8fafc;
            font-size: 11px;
        }

        .rute-name { font-weight: 600; color: var(--deep-blue); display: block; }
        .price-text { font-family: monospace; font-weight: 700; color: #e11d48; }

        .footer-info {
            margin-top: 15px;
            padding: 10px;
            background: #fffbeb;
            border-radius: 10px;
            font-size: 10px;
            color: #92400e;
            text-align: center;
            font-weight: 600;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="brand-container">
            <h1 class="title-brand">
                <span class="brand-mahika">PUTRA</span>
                <span class="brand-trans">Remaja</span>
            </h1>
            <span class="brand-sub">Tarif Lebaran 2026</span>
        </div>
    </div>

    <div class="main-container">
        <div class="price-card">
            <div class="tabs">
                <button class="tab-btn active" onclick="showData('exec', this)">EXECUTIVE</button>
                <button class="tab-btn" onclick="showData('super', this)">SUPER EXEC & SUITES</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Rute Tujuan</th>
                            <th>26 Mar - 06 Apr</th>
                        </tr>
                    </thead>
                    <tbody id="content-body">
                        </tbody>
                </table>
            </div>

            <div class="footer-info">
                * Mulai 20 April 2026 berlaku Tarif Normal.
            </div>
        </div>
    </div>

    <script>
        const dataExec = [
            { r: "Yogya - Lampung/Metro", p: "700.000" },
            { r: "Yogya - Kotabumi", p: "750.000" },
            { r: "Yogya - Way Abung", p: "750.000" },
            { r: "Yogya - Tulang Bawang", p: "750.000" },
            { r: "Yogya - Palembang/KM32", p: "800.000" },
            { r: "Yogya - Jambi/Betung", p: "900.000" },
            { r: "Yogya - Lubuk Linggau", p: "1.000.000" },
            { r: "Yogya - Muara Bungo", p: "1.050.000" },
            { r: "Yogya - Sungai Rumbai", p: "1.100.000" }
        ];

        const dataSuper = [
            { r: "Yogya - Palembang", p: "1.000.000" },
            { r: "Yogya - Jambi", p: "1.100.000" },
            { r: "Yogya - Muara Tembesi", p: "1.150.000" },
            { r: "Yogya - Lubuk Linggau", p: "1.200.000" },
            { r: "Yogya - Muara Bungo", p: "1.250.000" },
            { r: "Yogya - Sungai Rumbai", p: "1.300.000" }
        ];

        function showData(type, btn) {
            const body = document.getElementById('content-body');
            const items = type === 'exec' ? dataExec : dataSuper;
            
            // Toggle active button
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            body.innerHTML = items.map(item => `
                <tr>
                    <td><span class="rute-name">${item.r}</span></td>
                    <td><span class="price-text">Rp ${item.p}</span></td>
                </tr>
            `).join('');
        }

        // Init
        showData('exec', document.querySelector('.tab-btn'));
    </script>
</body>
</html>
