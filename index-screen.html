<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Trans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="screen.css">
</head>
<body class="bg-gray-200">

    <div class="max-w-md mx-auto bg-[#053a6f] min-h-screen relative shadow-2xl flex flex-col overflow-hidden">
        
        <div class="pt-10 px-8">
            <div class="flex bg-white rounded-xl overflow-hidden shadow-lg">
                <div class="flex items-center pl-4 text-yellow-500">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="search-input" placeholder="Mau kemana hari ini?" class="w-full p-4 outline-none text-sm font-medium text-gray-700">
                <button id="btnSearch" class="bg-[#f5b74d] text-[#053a6f] font-black px-6 uppercase text-[10px] tracking-widest">CARI</button>
            </div>
        </div>

        <main class="flex-1 px-10 pt-16 relative z-10">
            <h2 class="text-[#f5b74d] font-extrabold text-2xl mb-8">Hasil Pencarian:</h2>
            
            <div id="bus-list" class="space-y-6">
                <div class="text-white/20 text-center py-20">
                    <i class="fa-solid fa-bus-simple text-5xl mb-4"></i>
                    <p class="text-[10px] uppercase tracking-[0.3em]">Cari jadwal perjalanan</p>
                </div>
            </div>
        </main>

        <div class="white-curve"></div>

        <nav class="bg-white mx-5 mb-5 rounded-[25px] p-3 shadow-xl flex justify-between items-center relative z-20">
            <div class="bg-gray-100 px-4 py-2 rounded-xl flex flex-col leading-tight">
                <span class="text-[#053a6f] font-black text-sm tracking-tighter uppercase">Mahika</span>
                <span class="text-[#053a6f] font-bold text-[8px] tracking-widest uppercase opacity-60">Trans</span>
            </div>

            <div class="flex items-center gap-5 pr-2">
                <i class="fa-solid fa-mobile-screen-button text-gray-400 text-lg"></i>
                <i class="fa-solid fa-comment-dots text-gray-400 text-lg"></i>
                <i class="fa-solid fa-camera text-gray-400 text-lg"></i>
                <div class="w-10 h-10 bg-[#f5b74d] rounded-full flex items-center justify-center text-[#053a6f] shadow-lg shadow-orange-500/30">
                    <i class="fa-solid fa-play ml-1"></i>
                </div>
            </div>
        </nav>

    </div>

    <script type="module" src="screen.js"></script>
</body>
</html>
