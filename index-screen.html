<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahika Trans | Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="screen.css">
</head>
<body class="bg-gray-200 font-['Plus_Jakarta_Sans']">

    <div class="max-w-md mx-auto h-screen relative shadow-2xl overflow-hidden flex flex-col bg-white">
        
        <div class="relative bg-[#053a6f] flex-1 px-10 pt-20 pb-40 main-poster transition-all duration-500">
            <i class="fa-solid fa-quote-left text-5xl mb-6 text-white/20"></i>
            
            <div class="text-white relative z-10">
                <h1 class="text-3xl font-extrabold leading-tight mb-3">
                    Selamat Datang di <br> 
                    <span class="text-yellow-400">Mahika Trans</span>
                </h1>
                <p class="text-[11px] opacity-60 leading-relaxed max-w-[250px] mb-8">
                    Pusat reservasi tiket resmi Yogyakarta. Pilih jenis layanan perjalananmu di bawah ini.
                </p>

                <div class="grid grid-cols-2 gap-3 mt-4">
                    <div class="service-card flex items-center gap-3 bg-white/5 p-3 rounded-2xl border border-white/10">
                        <i class="fa-solid fa-bus text-yellow-400"></i>
                        <span class="text-[10px] font-bold uppercase">Bus Malam</span>
                    </div>
                    <div class="service-card flex items-center gap-3 bg-white/5 p-3 rounded-2xl border border-white/10">
                        <i class="fa-solid fa-van-shuttle text-yellow-400"></i>
                        <span class="text-[10px] font-bold uppercase">Travel</span>
                    </div>
                    <div class="service-card flex items-center gap-3 bg-white/5 p-3 rounded-2xl border border-white/10">
                        <i class="fa-solid fa-ship text-yellow-400"></i>
                        <span class="text-[10px] font-bold uppercase">Kapal Laut</span>
                    </div>
                    <div class="service-card flex items-center gap-3 bg-white/5 p-3 rounded-2xl border border-white/10">
                        <i class="fa-solid fa-plane text-yellow-400"></i>
                        <span class="text-[10px] font-bold uppercase">Pesawat</span>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-24 right-10 text-right z-20">
                <button onclick="openSearch()" class="group focus:outline-none">
                    <p class="text-[10px] font-black tracking-[0.2em] uppercase text-yellow-400 group-hover:text-white transition-all">Cari Jadwal</p>
                    <p class="text-[8px] text-white opacity-30 uppercase">Booking System</p>
                </button>
            </div>

            <div class="corner-mask"></div>
        </div>

        <div class="h-28 bg-white flex items-center px-6 relative">
            <nav class="bg-gray-100 w-full rounded-[25px] p-2.5 flex justify-between items-center shadow-sm">
                <div class="bg-white px-4 py-2 rounded-xl flex flex-col leading-none shadow-sm">
                    <span class="text-[#053a6f] font-black text-xs tracking-tighter uppercase">Mahika</span>
                    <span class="text-yellow-500 font-bold text-[7px] uppercase tracking-widest">Trans</span>
                </div>

                <div class="flex items-center gap-5 pr-2">
                    <i class="fa-solid fa-house text-yellow-500 text-lg"></i>
                    <i class="fa-solid fa-comment-dots text-gray-300 text-lg"></i>
                    <i class="fa-solid fa-user text-gray-300 text-lg cursor-pointer" onclick="toggleProfile()"></i>
                    <div class="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-[#053a6f] shadow-md">
                        <i class="fa-solid fa-magnifying-glass text-xs" onclick="openSearch()"></i>
                    </div>
                </div>
            </nav>
        </div>

        <div id="search-modal" class="fixed inset-0 bg-[#053a6f]/98 z-[100] hidden flex-col p-10 animate-fade-in">
            <button onclick="closeSearch()" class="self-end text-white text-3xl mb-10"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex bg-white rounded-2xl overflow-hidden mb-8 shadow-2xl">
                <input type="text" id="search-input" placeholder="Mau kemana?" class="w-full p-5 outline-none text-gray-800 font-bold text-sm">
                <button id="btnSearch" class="bg-yellow-400 px-8 text-[#053a6f] font-black uppercase text-[10px]">CARI</button>
            </div>
            <div id="bus-list" class="space-y-4 overflow-y-auto"></div>
        </div>

        <div id="company-profile" class="fixed inset-x-0 bottom-0 translate-y-full transition-transform duration-700 bg-[#053a6f] z-[2000] rounded-t-[40px] p-8 h-[80vh] overflow-y-auto border-t-4 border-yellow-400">
            <div class="w-16 h-1 bg-white/20 mx-auto mb-8 rounded-full" onclick="toggleProfile()"></div>
            <h2 class="text-yellow-400 font-black text-center text-xl mb-4">PROFILE KAMI</h2>
            <p class="text-white/60 text-xs text-center leading-relaxed">Mahika Trans adalah pusat reservasi tiket resmi Yogyakarta yang dipercaya ribuan pelanggan.</p>
            </div>
    </div>

    <script type="module" src="screen.js"></script>
</body>
                        </html>
